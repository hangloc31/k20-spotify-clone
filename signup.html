<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spotify signup page clone - create a new account, built with Vite and Tailwind CSS for educational purposes."
    />
    <title>Đăng ký - Spotify</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/signup.css" />
  </head>
  <body class="signup-page">
    <main class="signup-page__main">
      <header class="signup-page__header">
        <a href="/" aria-label="Spotify">
          <i
            class="ph-fill ph-spotify-logo text-[48px] leading-none text-white"
            aria-hidden="true"
          ></i>
        </a>
      </header>

      <section class="signup-page__card" aria-labelledby="signup-title">
        <h1 id="signup-title" class="signup-page__title">Tạo tài khoản</h1>

        <p class="signup-form__error" role="alert" hidden></p>

        <form class="signup-form" action="#" method="post" novalidate>
          <div class="signup-form__field">
            <label for="username">Tên người dùng</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              class="signup-form__input"
              placeholder="username"
              maxlength="30"
              required
            />
            <p class="error-msg"></p>
          </div>

          <div class="signup-form__field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              class="signup-form__input"
              placeholder="email"
              required
            />
            <p class="error-msg"></p>
          </div>

          <div class="signup-form__field">
            <label for="password">Mật khẩu</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="new-password"
              class="signup-form__input"
              minlength="6"
              placeholder="password"
              required
            />
            <p class="error-msg"></p>
          </div>

          <div class="signup-form__field">
            <label for="display_name">Tên hiển thị</label>
            <input
              type="text"
              id="display_name"
              name="display_name"
              autocomplete="name"
              class="signup-form__input"
              placeholder="Tên hiển thị"
              maxlength="60"
              required
            />
            <p class="error-msg"></p>
          </div>

          <div class="signup-form__field">
            <label for="bio">Giới thiệu bản thân</label>
            <textarea
              id="bio"
              name="bio"
              class="signup-form__input signup-form__textarea"
              placeholder="Giới thiệu về bạn"
              rows="3"
              maxlength="300"
              required
            ></textarea>
            <p class="error-msg"></p>
          </div>

          <div class="signup-form__field">
            <label for="country">Quốc gia</label>
            <select
              id="country"
              name="country"
              class="signup-form__input signup-form__select"
              required
            >
              <option value="VN" selected>Việt Nam</option>
              <option value="US">United States</option>
              <option value="JP">Japan</option>
              <option value="KR">South Korea</option>
              <option value="GB">United Kingdom</option>
              <option value="DE">Germany</option>
              <option value="FR">France</option>
              <option value="SG">Singapore</option>
              <option value="TH">Thailand</option>
              <option value="ID">Indonesia</option>
            </select>
            <p class="error-msg"></p>
          </div>

          <button type="submit" class="signup-form__submit">Đăng ký</button>
        </form>

        <div class="signup-page__login">
          <p>Đã có tài khoản?</p>
          <a href="login.html" class="signup-page__login-link">Đăng nhập</a>
        </div>
      </section>

      <p class="signup-page__notice">
        Trang web này được bảo vệ bằng reCAPTCHA và tuân theo
        <a href="#">Chính sách quyền riêng tư</a> cũng như
        <a href="#">Điều khoản dịch vụ</a> của Google.
      </p>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <i
        class="toast__icon ph-fill ph-check-circle"
        aria-hidden="true"
      ></i>
      <span class="toast__message"></span>
    </div>

    <script type="module" src="/src/js/signup.js"></script>
  </body>
</html>
