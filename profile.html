<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spotify profile page clone - user profile, built with Vite and Tailwind CSS for educational purposes."
    />
    <title>Hồ sơ - Spotify</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/profile.css" />
  </head>
  <body class="profile-page">
    <header class="top-bar flex justify-between items-center">
      <a href="/" aria-label="Spotify">
        <i
          class="ph-fill ph-spotify-logo text-[32px] leading-none text-white"
          aria-hidden="true"
        ></i>
      </a>

      <div class="top-bar__user" data-auth-user hidden>
        <button
          class="pill-button pill-button--ghost px-3 py-2 text-sm"
          data-logout
        >
          <i
            class="ph-fill ph-sign-out text-[16px] leading-none"
            aria-hidden="true"
          ></i>
          <span>Đăng xuất</span>
        </button>
      </div>
    </header>

    <main class="profile-page__main">
      <section class="profile-card" aria-labelledby="profile-name">
        <div class="profile-card__avatar">
          <img data-card-avatar-img src="" alt="" hidden />
          <span data-card-avatar-initial></span>
        </div>

        <h1 id="profile-name" class="profile-card__name" data-display-name></h1>
        <p class="profile-card__username" data-username></p>
        <p class="profile-card__joined" data-joined></p>
        <p class="profile-card__email" data-email></p>

        <dl class="profile-card__stats">
          <div class="profile-stat">
            <dt class="profile-stat__value" data-stat-playlists>–</dt>
            <dd class="profile-stat__label">Playlists</dd>
          </div>
          <div class="profile-stat">
            <dt class="profile-stat__value" data-stat-following>–</dt>
            <dd class="profile-stat__label">Đang theo dõi</dd>
          </div>
          <div class="profile-stat">
            <dt class="profile-stat__value" data-stat-plays>–</dt>
            <dd class="profile-stat__label">Lượt nghe</dd>
          </div>
        </dl>

        <p class="profile-card__error" role="alert" hidden></p>
      </section>
    </main>

    <script type="module" src="/src/js/profile.js"></script>
  </body>
</html>
